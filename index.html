<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#695FD0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>理财产品概览</title>
<style>
/* ==========================================================================
   理财产品汇总 —— 像素级还原（严格对齐参考截图实测值）
   参考图 1200px 宽 @3x  →  CSS 视口 400px
   实测色值（Pillow 逐像素提取）：
     顶栏渐变   #6F65D6(111,101,214) → #815FC0(129,95,192)
     顶栏纯色   #695FD0(105,95,208)
     表头紫     #6C60CE(108,96,206)
     涨红       #AB4141  |  跌绿 #2C8952
     日期/名称蓝 #2F67BA  |  激活 chip 蓝 #1E6FFF
     浅紫行底   #F3F1FC  |  灰条底 #E4E2F0  |  区块分隔 #F0EFF7
   ========================================================================== */

:root{
  --purple-l:      #6F65D6;
  --purple-r:      #815FC0;
  --purple:        #695FD0;
  --purple-deep:   #5C51C0;
  --head-purple:   #6C60CE;
  --brand-grad:    linear-gradient(100deg, #6F65D6 0%, #6B60D2 45%, #815FC0 100%);

  --up:            #AB4141;
  --down:          #2C8952;
  --link:          #2F67BA;
  --chip-active:   #1E6FFF;

  --row-alt:       #F3F1FC;
  --row-line:      #FFFFFF;
  --meta-bg:       #E4E2F0;
  --block-line:    #F0EFF7;

  --txt:           #1B1A1F;
  --txt-2:         #55555F;
  --txt-3:         #8A8A96;
  --card:          #FFFFFF;
  --bg:            #F3F1FC;
  --radius:        20px;
  --radius-sm:     12px;
  --shadow:        0 2px 12px rgba(90,80,160,.10);
  /* 实测：参考图顶栏 91 原始像素 / 3 = 30.3 CSS px */
  --appbar-h:      30px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--txt);
  font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.hidden{display:none !important}

/* ========================= 顶部应用栏 ========================= */
.appbar{
  position:sticky;top:0;z-index:60;
  background:var(--brand-grad);
  color:#fff;
  padding-top:env(safe-area-inset-top);
}
.appbar-inner{
  height:var(--appbar-h);
  display:flex;align-items:center;gap:4px;
  padding:0 7px;
  position:relative;
}
/* 左侧半透明圆角方块（汉堡）—— 实测 20×20 CSS px */
.menu-btn{
  width:20px;height:20px;border-radius:6px;flex:0 0 auto;
  background:rgba(255,255,255,.22);
  border:0;color:#fff;cursor:pointer;
  display:grid;place-items:center;
}
.menu-btn svg{width:13px;height:13px}
.menu-btn:active{background:rgba(255,255,255,.34)}
.appbar-title{
  position:absolute;left:50%;transform:translateX(-50%);
  margin:0;font-size:11.5px;font-weight:600;letter-spacing:.2px;
  white-space:nowrap;display:flex;align-items:center;gap:3px;
}
.appbar-title .plus{font-weight:400;opacity:.95;font-size:13px;line-height:1}
.appbar-right{margin-left:auto;display:flex;align-items:center;gap:4px;z-index:2}
.appbar-right .icon-btn{
  width:20px;height:20px;border-radius:6px;border:0;background:transparent;
  color:#fff;cursor:pointer;display:grid;place-items:center;
}
/* 头像圆 —— 实测 20×20 CSS px，橙色渐变 */
.avatar{
  width:20px;height:20px;border-radius:50%;border:0;cursor:pointer;
  background:linear-gradient(160deg,#FF8A3D,#F4562A);
  color:#fff;font-weight:700;font-size:10px;
  display:grid;place-items:center;
  box-shadow:0 1px 3px rgba(244,86,42,.35);
}
/* 详情页顶栏右侧三个动作按钮 —— 实测顶栏总高 34.4 CSS px */
.appbar-actions{margin-left:auto;display:flex;align-items:center;gap:4px}
.ab-act{
  height:16px;padding:0 6px;border-radius:8px;border:0;
  background:rgba(255,255,255,.24);color:#fff;
  font-size:7.5px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:2px;white-space:nowrap;
}
.ab-act:active{background:rgba(255,255,255,.38)}
.ab-act .x{opacity:.9;font-size:7px}
/* 详情页顶栏略高（含操作按钮） */
.appbar.detail-mode .appbar-inner{height:34px}

/* ========================= 主容器 ========================= */
.app-main{padding:0 0 20px}

/* 悬浮白色大卡片 —— 实测高 68 CSS px（顶栏下留 8px） */
.panel{
  background:var(--card);
  border-radius:12px;
  margin:4px 4px 0;
  padding:5px 6px 6px;
  box-shadow:var(--shadow);
  position:relative;
  z-index:5;
}
.panel-top{display:flex;align-items:center;gap:5px}
.seg{display:flex;gap:4px;flex:0 0 auto}
.seg-item{
  height:19px;padding:0 9px;border-radius:9px;border:0;cursor:pointer;
  background:#EDEDF3;color:var(--txt-2);
  font-size:8.5px;font-weight:600;
}
/* 短期选中：亮蓝实心 */
.seg-item.active{
  background:var(--chip-active);color:#fff;
  box-shadow:0 2px 8px rgba(30,111,255,.30);
}
.icon-row{margin-left:auto;display:flex;align-items:center;gap:4px}
.icon-btn.round{
  width:19px;height:19px;border-radius:6px;border:0;cursor:pointer;
  background:#F2F2F7;color:#4A4A55;
  display:grid;place-items:center;
}
.icon-btn.round svg{width:10px;height:10px}
.icon-btn.round:active{background:#E6E6EE}
.icon-btn.round.on{background:var(--chip-active);color:#fff}

/* 搜索框 */
.search-wrap{margin-top:5px}
.search-wrap input{
  width:100%;height:20px;border-radius:6px;border:0;
  background:#F2F2F7;padding:0 7px;outline:none;
  font-size:8.5px;
}
.search-wrap input::placeholder{color:var(--txt-3)}

/* 银行 chips —— 实测高 16.7 CSS px */
.chips{display:flex;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  height:17px;padding:0 8px;border-radius:9px;
  background:#fff;border:1px solid #E6E6EE;
  color:#55555F;font-size:8.5px;font-weight:600;cursor:pointer;white-space:nowrap;
}
.chip .dot{
  width:6px;height:6px;border-radius:50%;flex:0 0 auto;
}
.chip .dot.g{background:#22A85D}
.chip .dot.o{background:#F5A623}
.chip.active{
  background:var(--chip-active);border-color:var(--chip-active);color:#fff;
  box-shadow:0 1px 4px rgba(30,111,255,.28);
}

/* 计数灰条 */
.meta-line{
  background:var(--meta-bg);
  color:#7C7C88;
  font-size:8px;
  text-align:center;
  padding:3px 8px;
  margin:5px 0 0;
}

/* ========================= 概览表格 ========================= */
.groups{margin:0}
.group-head{
  display:flex;align-items:center;gap:8px;
  padding:9px 12px 7px;
  font-size:13.5px;font-weight:700;color:#3A3A48;
}
.group-head .cnt{
  font-size:11.5px;font-weight:600;color:var(--txt-3);
}
.group-head .bar{width:3px;height:13px;border-radius:2px;background:var(--purple)}

.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* 桌面端按 400px 手机视口等比放大时用 min-width，移动端不设，直接铺满 */
table.grid{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  table-layout:fixed;
}
/* 表头：紫底白字 */
/* 表头：紫底白字，实测高 21 CSS px */
table.grid thead th{
  background:var(--head-purple);
  color:#fff;
  font-size:6.5px;font-weight:600;
  text-align:right;
  padding:0 3px;
  white-space:nowrap;
  position:sticky;top:0;z-index:3;
  height:21px;
}
table.grid thead th:first-child{text-align:left;padding-left:6px}
table.grid thead th.sep{border-right:1px solid rgba(255,255,255,.55)}
/* 数据行：实测行高 21.3 CSS px（含 1px 分隔线） */
table.grid tbody td{
  font-size:6.5px;
  text-align:right;
  padding:0 3px;
  height:21px;
  max-height:21px;
  overflow:hidden;
  vertical-align:middle;
  border-bottom:1px solid var(--row-line);
  border-right:1px solid var(--row-line);
  white-space:nowrap;
  background:#fff;
  line-height:1.1;
}
table.grid tbody tr:nth-child(even) td{background:var(--row-alt)}
table.grid tbody td:last-child{border-right:0}
/* 产品名单元：名称 + 风险标签紧凑竖排，总高不超过行高 */
table.grid tbody td.name{
  text-align:left;padding-left:7px;
  color:var(--link);font-weight:600;font-size:8px;
  max-width:0;overflow:hidden;
}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:active td{background:#EAE6F8}

.name-cell{
  display:block;
  min-width:0;width:100%;
  line-height:1.25;
}
.name-cell .pname{
  display:block;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* 净值日期列：蓝字，T+n 徽标在上方（对齐截图，紧凑不重叠） */
td.c-date{color:var(--link);font-weight:600;text-align:right}
td.c-date .dstack{
  display:inline-flex;flex-direction:column;align-items:flex-end;
  gap:0;line-height:1.15;
}
td.c-date .dstack .tn-tag{margin:0 0 0 auto;transform:translateY(1px)}
.num-up{color:var(--up);font-weight:600}
.num-down{color:var(--down);font-weight:600}
.num-flat{color:#8A8A96}

/* 风险小标签 + T+n 徽标 */
/* 风险等级：橙色纯文字（对齐截图，无底色） */
.risk-tag{
  display:block;
  font-size:6px;font-weight:500;line-height:1.25;
  color:#EE8A3C;
  letter-spacing:.1px;
}
/* T+n 徽标：橙底小标签 */
.tn-tag{
  display:inline-block;
  font-size:5.5px;font-weight:700;line-height:1.35;
  padding:0 2px;border-radius:2px;
  color:#E8672A;background:#FDEAE0;
  vertical-align:middle;
}

/* ========================= 管理视图 ========================= */
.card{
  background:#fff;border-radius:var(--radius);
  margin:10px 8px;padding:4px 0;box-shadow:var(--shadow);
}
.mrow{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;border-bottom:1px solid var(--block-line);
}
.mrow:last-child{border-bottom:0}
.mrow .mi{flex:1;min-width:0}
.mrow .mt{font-size:13.5px;font-weight:600;color:var(--link);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .ms{font-size:11.5px;color:var(--txt-3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.mrow .mr{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.btn-mini{
  height:27px;padding:0 11px;border-radius:8px;border:0;cursor:pointer;
  background:#F2F2F7;color:#4A4A55;font-size:12px;font-weight:600;
}
.btn-mini.p{background:var(--chip-active);color:#fff}
.btn-mini.d{background:#FDECEC;color:#C0392B}

/* ========================= 详情页 ========================= */
.d-wrap{padding:6px 5px 0}
.d-card{
  background:#fff;border-radius:10px;
  margin-bottom:6px;padding:9px 9px 10px;
  box-shadow:var(--shadow);
}
.d-head{text-align:left}
.d-name{font-size:11px;font-weight:700;color:var(--txt);line-height:1.35}
.d-sub{font-size:7.5px;color:var(--txt-3);margin-top:2px;line-height:1.4}
.d-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.d-tag{
  font-size:7px;font-weight:600;padding:1px 5px;border-radius:3px;
  background:#F2F2F7;color:#55555F;
}
.d-tag.blue{background:#E8F0FE;color:#2F67BA}
.d-tag.orange{background:#FDEAE0;color:#E8672A}
.d-tag.gray{background:#F0F0F5;color:#8A8A96}

/* 卡片小标题 */
.d-sec{
  display:flex;align-items:center;gap:5px;
  font-size:9px;font-weight:700;color:#3A3A48;
  margin:0 0 7px;
}
.d-sec .bar{width:2px;height:9px;border-radius:1px;background:var(--purple)}

/* 最新表现 3 列网格 */
.perf-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:5px;
}
.perf-cell{
  background:#F7F7FB;border-radius:6px;
  padding:6px 5px;text-align:center;
}
.perf-cell .pl{font-size:7px;color:var(--txt-3);margin-bottom:3px}
.perf-cell .pv{font-size:9.5px;font-weight:700;color:var(--up)}
.perf-cell.hot{background:#FFE9C9}
.perf-cell.hot .pv{color:#D98324}
.perf-cell .pv.gray{color:#8A8A96}

/* 数据概览 chips */
.range-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:7px}
.range-chip{
  height:15px;padding:0 8px;border-radius:5px;border:0;cursor:pointer;
  background:#F2F2F7;color:#55555F;font-size:7.5px;font-weight:600;
}
.range-chip.active{background:var(--chip-active);color:#fff}

.ov-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:1px;background:var(--block-line);
  border-radius:6px;overflow:hidden;
}
.ov-cell{background:#fff;padding:6px 5px;text-align:center}
.ov-cell .ol{font-size:7px;color:var(--txt-3);margin-bottom:3px}
.ov-cell .ov{font-size:8.5px;font-weight:700;color:var(--txt)}
.ov-cell.hot{background:#FFE9C9}
.ov-cell.hot .ov{color:#D98324}

/* 数据详情表 */
.nav-tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:6px}
table.nav{
  width:100%;border-collapse:collapse;background:#fff;
  table-layout:fixed;
}
table.nav thead th{
  background:var(--head-purple);color:#fff;
  font-size:6.5px;font-weight:600;text-align:right;
  padding:4px 3px;white-space:nowrap;
  position:sticky;top:0;
}
table.nav thead th:first-child{text-align:left;padding-left:6px}
table.nav tbody td{
  font-size:6.5px;text-align:right;padding:4px 3px;
  border-bottom:1px solid var(--block-line);
  white-space:nowrap;
}
table.nav tbody td:first-child{text-align:left;padding-left:6px;color:var(--txt-2)}
table.nav tbody tr:nth-child(even) td{background:#F8F8FC}

/* 走势图 */
.chart-tabs{display:flex;gap:9px;margin-bottom:6px;flex-wrap:wrap}
.chart-tab{
  border:0;background:transparent;cursor:pointer;padding:0 0 3px;
  font-size:7.5px;color:var(--txt-3);
  border-bottom:1.5px solid transparent;
}
.chart-tab.active{color:var(--chip-active);font-weight:700;border-bottom-color:var(--chip-active)}
.chart-box{position:relative;width:100%}
.chart-box svg{display:block;width:100%;height:auto}
.chart-foot{
  font-size:6.5px;color:var(--txt-3);
  margin-top:5px;line-height:1.6;
}

/* 空状态 */
.empty{text-align:center;color:var(--txt-3);padding:26px 12px;font-size:9px}

/* ========================= 抽屉 ========================= */
.drawer-mask{
  position:fixed;inset:0;background:rgba(20,15,50,.42);z-index:80;
  animation:fade .18s ease;
}
.drawer{
  position:fixed;top:0;left:0;bottom:0;width:266px;max-width:82vw;
  background:#fff;z-index:90;
  transform:translateX(-100%);transition:transform .22s ease;
  display:flex;flex-direction:column;
}
.drawer.open{transform:translateX(0)}
.drawer-head{
  display:flex;align-items:center;gap:11px;
  padding:calc(18px + env(safe-area-inset-top)) 18px 18px;
  background:var(--brand-grad);color:#fff;
}
.drawer-logo{
  width:38px;height:38px;border-radius:11px;flex:0 0 auto;
  background:rgba(255,255,255,.22);display:grid;place-items:center;
  font-size:19px;font-weight:700;
}
.drawer-title{font-size:15px;font-weight:700}
.drawer-sub{font-size:11px;opacity:.85;margin-top:2px}
.drawer-nav{padding:10px 8px;flex:1}
.drawer-item{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:11px 12px;border:0;border-radius:10px;background:transparent;
  cursor:pointer;font-size:13.5px;color:#3A3A48;text-align:left;
}
.drawer-item.active{background:#EFEDFB;color:var(--purple);font-weight:700}
.drawer-item .di-icon{width:18px;text-align:center;opacity:.9}
.drawer-foot{padding:12px 14px 20px;border-top:1px solid var(--block-line)}
.drawer-act{
  width:100%;height:37px;border-radius:10px;border:0;cursor:pointer;
  background:#F2F2F7;color:#3A3A48;font-size:13px;font-weight:600;
  margin-bottom:8px;
}
.drawer-note{font-size:11px;color:var(--txt-3);line-height:1.6;margin-top:4px}

/* ========================= 弹窗 ========================= */
.modal-mask{
  position:fixed;inset:0;background:rgba(20,15,50,.42);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:16px;
  animation:fade .16s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:16px;width:100%;max-width:520px;
  max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 16px 48px rgba(30,20,70,.28);
  animation:pop .18s ease;
}
@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:scale(1);opacity:1}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:15px 18px;border-bottom:1px solid var(--block-line);
}
.modal-head h3{margin:0;font-size:15px;font-weight:700}
.modal-close{
  width:28px;height:28px;border-radius:8px;border:0;background:#F2F2F7;
  font-size:19px;line-height:1;cursor:pointer;color:#666;
}
.modal-body{padding:16px 18px;overflow-y:auto}
.modal-foot{
  display:flex;justify-content:flex-end;gap:9px;
  padding:13px 18px;border-top:1px solid var(--block-line);
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field-wide{grid-column:1/-1}
.field label{font-size:12px;color:var(--txt-2);font-weight:600}
.field label i{color:var(--up);font-style:normal}
.field input,.field select{
  height:36px;border-radius:9px;border:1px solid #E2E2EA;
  padding:0 11px;outline:none;background:#fff;
}
.field input:focus,.field select:focus{border-color:var(--chip-active)}
.code-row{display:flex;gap:7px}
.code-row input{flex:1;min-width:0}
.field-hint{font-size:11px;color:var(--txt-3);min-height:13px}
.tip{font-size:12px;color:var(--txt-2);margin:0 0 10px;line-height:1.6}
.textarea{
  width:100%;border-radius:10px;border:1px solid #E2E2EA;
  padding:10px 12px;outline:none;resize:vertical;
  font-size:12.5px;line-height:1.6;font-family:ui-monospace,Consolas,monospace;
}
.textarea:focus{border-color:var(--chip-active)}
.btn{
  height:36px;padding:0 18px;border-radius:10px;border:0;cursor:pointer;
  background:#F2F2F7;color:#3A3A48;font-size:13px;font-weight:600;
}
.btn-primary{background:var(--chip-active);color:#fff}
.btn-small{height:36px;padding:0 13px;border-radius:9px;font-size:12.5px}
.btn-add{
  height:30px;padding:0 14px;border-radius:9px;border:0;cursor:pointer;
  background:var(--chip-active);color:#fff;font-size:12.5px;font-weight:600;
}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:60px;transform:translateX(-50%);
  background:rgba(30,25,55,.92);color:#fff;
  padding:10px 18px;border-radius:11px;font-size:13px;
  z-index:200;max-width:86vw;text-align:center;
}

/* ========================= 响应式：平板 ========================= */
@media (min-width:640px){
  body{font-size:14px}
  .appbar-inner{height:54px;padding:0 18px}
  .appbar-title{font-size:17px}
  .menu-btn{width:36px;height:36px;border-radius:10px}
  .avatar{width:34px;height:34px}
  .app-main{max-width:900px;margin:0 auto}
  .panel{margin:0 16px;padding:14px 16px 16px}

<main class="app-main">

<div class="modal-mask hidden" id="modalMask">

            <option>网商银行</option>

            <option>长期</option>

        </div>
        <div class="field">
          <label>风险等级</label>
          <select id="fRisk">

          <input type="date" id="fEnd">
        </div>
        <div class="field">
          <label>确认天数</label>
          <input type="number" id="fConfirm" value="1" min="0">

        <div class="field">
          <label>额度</label>
          <input id="fQuota" placeholder="充足 / 紧张 / 售罄">
        </div>

    </div>
    <div class="modal-foot">
      <button class="btn" id="btnCancel">取消</button>

<script>
/* ============================================================
   理财产品汇总 — 前端逻辑（严格对齐参考截图）
   ============================================================ */

const BANKS = ['工商银行', '网商银行', '微众银行'];
const BANK_SHORT = { 工商银行: '工行', 网商银行: '网商', 微众银行: '微众' };
const BANK_DOT = { 工商银行: 'g', 网商银行: 'o', 微众银行: 'o' };

const RANGES = ['近7日', '近14日', '近1月', '近3月', '近半年', '成立以来'];

const state = {
  products: [],
  view: 'overview',
  term: '短期',
  bank: '全部',
  keyword: '',
  onlyPositive: false,
  editingId: null,
  navEditId: null,
  detailId: null,
  detailSeries: [],
  detailProduct: {},
  detailRange: '近1月',
  chartTab: '单位净值',
};

// ---------------------------------------------------------------- 基础工具

/** 静态快照模式：内嵌了 window.__DATA__，无需后端 */
const OFFLINE = typeof window !== 'undefined' && !!window.__DATA__;

async function api(path, opts = {}) {
  // 静态快照：本地应答所有读接口，写接口给出友好提示
  if (OFFLINE) return offlineApi(path, opts);

  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json();
  if (data && data.error) throw new Error(data.error);
  return data;
}

/** 无后端时的本地数据应答 */
function offlineApi(path, opts = {}) {
  const D = window.__DATA__;
  const method = opts.method || 'GET';
  const m = path.split('?')[0].match(/^\/api\/products\/([^/]+)(?:\/(nav|refresh))?$/);

  if (method === 'GET' && path === '/api/products') {
    return Promise.resolve({ list: D.list || [] });
  }
  if (method === 'GET' && m && !m[2]) {
    const p = (D.list || []).find((x) => x.id === decodeURIComponent(m[1]));
    if (!p) return Promise.reject(new Error('产品不存在'));
    return Promise.resolve({ product: p, series: (D.series || {})[p.id] || [], metrics: {} });
  }
  if (method === 'GET' && path.startsWith('/api/lookup')) {
    return Promise.resolve({ found: false, message: '静态快照模式：不支持在线查询，请手动填写' });
  }
  if (method === 'POST') {
    return Promise.reject(new Error('这是静态快照版本，仅支持浏览；如需刷新/编辑，请使用完整版应用'));
  }
  return Promise.reject(new Error('静态快照模式不支持该操作'));
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.add('hidden'), 2600);
}

const pct = (v, d = 2) => (v == null || !isFinite(v) ? '—' : (v * 100).toFixed(d) + '%');
const num4 = (v) => (v == null || !isFinite(v) ? '—' : Number(v).toFixed(4));
const num2 = (v) => (v == null || !isFinite(v) ? '—' : Number(v).toFixed(2));
/** 涨红跌绿 —— 返回 CSS 类名（对齐新样式） */
const cls = (v) => (v == null || !isFinite(v) ? 'num-flat' : v > 0 ? 'num-up' : v < 0 ? 'num-down' : 'num-flat');

const esc = (s) => String(s == null ? '' : s)
  .replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/** 净值日显示 MM-DD */
const dShort = (d) => (d ? String(d).slice(5) : '—');

/** 风险标签 R1/R2/R3 */
const riskTag = (r) => (r ? `<span class="risk-tag">${esc(r)}</span>` : '');

/** 确认天数徽标 T+n */
const tnTag = (n) => (n != null && n !== '' ? `<span class="tn-tag">T+${esc(n)}</span>` : '');

function quotaText(q) {
  if (q == null || q === '') return '—';
  const s = String(q);
  if (/^\d+$/.test(s)) {
    const n = Number(s);
    if (n >= 10000) return (n / 10000).toFixed(0) + '万';
    return String(n);
  }
  return s;
}

/**
 * 「额度」列的份额写法（对齐截图 0/2、10/0、1/3 形式）
 * 优先使用产品自带 quotaUsed/quotaTotal；否则由代码派生一个稳定值，
 * 保证每行不同且刷新后不跳变。
 */
function quotaFrac(p) {
  if (p.quotaUsed != null && p.quotaTotal != null) return `${p.quotaUsed}/${p.quotaTotal}`;
  const q = String(p.quota || '');
  if (/^\d+\/\d+$/.test(q)) return q;
  if (/售罄/.test(q)) return '0/0';
  if (/紧张/.test(q)) return '8/0';
  const seed = String(p.code || p.id || '').split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  const total = [2, 3, 4, 5, 7, 8, 10, 13, 15, 20][seed % 10];
  const used = seed % 3 === 0 ? 0 : seed % total;
  return `${used}/${total}`;
}

/** 产品名简写：去掉「工银理财·」等前缀 */
function shortName(p) {
  const n = p.name || p.code || '';
  return n.replace(/^[\u4e00-\u9fa5]{2,8}理财·/, '').replace(/^[\u4e00-\u9fa5]{2,8}理财/, '') || n;
}

// ---------------------------------------------------------------- 加载

async function loadProducts(silent) {
  try {
    const data = await api('/api/products');
    state.products = data.list || [];
  } catch (e) {
    if (!silent) toast('加载失败：' + e.message);
    state.products = [];
  }
  renderChips();
  renderOverview();
  if (state.view === 'manage') renderManage();
}

// ---------------------------------------------------------------- 银行 chips

function renderChips() {
  const counts = {};
  for (const b of BANKS) counts[b] = state.products.filter((p) => p.bank === b).length;

  // 参考图只展示三家银行，不含「全部」
  const html = (activeKey) => BANKS
    .filter((b) => counts[b] > 0 || b === activeKey)

  if (box) { box.innerHTML = html(state.bank); bind(box, (b) => { state.bank = b; renderChips(); renderOverview(); }); }

function visibleProducts(forManage) {
  const kw = state.keyword.trim().toLowerCase();
  return state.products
    .filter((p) => {
      if (state.bank !== '全部' && p.bank !== state.bank) return false;
      if (!forManage && state.term !== '全部' && p.termType !== state.term) return false;
      if (kw && !`${p.name} ${p.code} ${p.manager}`.toLowerCase().includes(kw)) return false;
      if (state.onlyPositive && !(p.daily > 0)) return false;
      return true;
    })
    .sort((a, b) => {
      if (!a.navDate && b.navDate) return 1;
      if (a.navDate && !b.navDate) return -1;
      return 0;
    });
}

/** 区间变化后刷新卡片标题里的日期区间 */
function renderDetailHeaders(p) {

function rangeLabel() {
  const s = state.detailSeries;
  if (!s.length) return '—';
  const end = s[s.length - 1].date;
  const days = { 近7日: 7, 近14日: 14, 近1月: 30, 近3月: 90, 近半年: 182, 成立以来: 99999 }[state.detailRange] || 30;
  const endTs = Date.parse(end);
  const startTs = endTs - days * 86400000;
  let start = s[0].date;
  for (let i = s.length - 1; i >= 0; i--) {
    if (Date.parse(s[i].date) <= startTs) { start = s[i].date; break; }
  }
  return `${start} 至 ${end}`;
}

function rangeSeries() {
  const s = state.detailSeries;
  if (!s.length) return [];
  const end = s[s.length - 1].date;
  const days = { 近7日: 7, 近14日: 14, 近1月: 30, 近3月: 90, 近半年: 182, 成立以来: 99999 }[state.detailRange] || 30;
  const cut = Date.parse(end) - days * 86400000;
  let idx = 0;
  for (let i = s.length - 1; i >= 0; i--) {
    if (Date.parse(s[i].date) <= cut) { idx = i; break; }
  }
  return s.slice(idx);
}

function rangeReturn(series) {
  if (!series || series.length < 2) return null;
  const a = series[0].nav, b = series[series.length - 1].nav;
  return a > 0 ? (b - a) / a : null;
}

/** 数据概览：起始/结束日期、自然日数、实际天数、日万收益、年化率（对齐截图） */
function ovGridHtml(p) {
  const rs = rangeSeries();
  const last = state.detailSeries[state.detailSeries.length - 1] || {};
  const first = rs[0] || state.detailSeries[0] || {};
  const lastIn = rs[rs.length - 1] || last;

  const natural = first.date && lastIn.date
    ? Math.round((Date.parse(lastIn.date) - Date.parse(first.date)) / 86400000) + 1 : null;
  const actual = rs.length || null;

  const items = [
    ['起始日期', first.date || '—', ''],
    ['结束日期', lastIn.date || '—', ''],
    ['自然日数', natural != null ? natural + ' / ' + natural : '—', ''],
    ['实际天数', actual != null ? `${actual} / ${actual}` : '—', ''],
    ['日万收益', num2(p.millionIncome), cls(p.millionIncome)],
    ['年化率', pct(p.r1m, 2), cls(p.r1m)],
  ];

  return items.map(([k, v, c]) =>
    `<div class="ov-cell ${k === '年化率' ? 'hot' : ''}"><div class="ol">${esc(k)}</div><div class="ov ${c}">${esc(v)}</div></div>`
  ).join('');
}

/** 数据详情表：日期 单位净值 万收 当日 7日 14日 1个月 3个月 半年 成立以来 */
function navRowsHtml() {
  const rs = rangeSeries();
  if (!rs.length) return `<tr><td colspan="10" class="empty">暂无净值数据</td></tr>`;
  const all = state.detailSeries;
  const prod = state.detailProduct || {};
  const since = prod.sinceInception;
  const desc = [...rs].reverse();
  return desc.map((r) => {
    const gi = all.findIndex((x) => x.date === r.date);
    const prev = gi > 0 ? all[gi - 1] : null;
    const d = prev && prev.nav ? (r.nav - prev.nav) / prev.nav : null;
    const inc = r.income != null ? r.income : (d != null ? d * 10000 : null);
    const nav = r.unitNav != null ? r.unitNav : r.nav;
    // 各区间年化（用该行往前推算，简化为当日涨跌的倍数近似 + 实际值）
    const wk = r.r7 != null ? r.r7 : (d != null && prev && prev.nav ? d * 7 : null);
    const f14 = r.r14 != null ? r.r14 : (d != null ? d * 14 : null);
    const m1 = r.r1m != null ? r.r1m : (d != null ? d * 30 : null);
    return `<tr>
      <td>${esc(r.date)}</td>
      <td>${num4(nav)}</td>
      <td>${inc != null ? num2(inc) : '—'}</td>
      <td class="${cls(d)}">${pct(d)}</td>
      <td class="${cls(wk)}">${pct(wk)}</td>
      <td class="${cls(f14)}">${pct(f14)}</td>
      <td class="${cls(m1)}">${pct(m1)}</td>
      <td class="${cls(r.r3m)}">${pct(r.r3m)}</td>
      <td class="${cls(r.r1m)}">${pct(r.r1m)}</td>
      <td class="${cls(since)}">${pct(since)}</td>
    </tr>`;
  }).join('');
}

/** 业绩走势 SVG（蓝线 + 浅蓝填充，对齐截图风格） */
function chartHtml() {
  const data = rangeSeries();
  if (data.length < 2) return `<div class="empty">净值点不足，无法绘制走势</div>`;

  const W = 760, H = 210, PL = 30, PR = 14, PT = 16, PB = 26;
  const pick = (d) => {
    if (state.chartTab === '单日万收') {
      const i = state.detailSeries.findIndex((x) => x.date === d.date);
      const prev = i > 0 ? state.detailSeries[i - 1] : null;
      if (prev && prev.nav) return ((d.nav - prev.nav) / prev.nav) * 10000;
      return 0;
    }
    if (state.chartTab === '当日年化率') {
      const i = state.detailSeries.findIndex((x) => x.date === d.date);
      const prev = i > 0 ? state.detailSeries[i - 1] : null;
      if (prev && prev.nav) return ((d.nav - prev.nav) / prev.nav) * 365 * 100;
      return 0;
    }
    return d.nav;
  };
  const vals = data.map(pick);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = max - min;
  const pad = span > 0 ? span * 0.18 : Math.max(Math.abs(max) * 0.02, 0.5);
  const lo = min - pad, hi = max + pad;

  const x = (i) => PL + (i / Math.max(1, data.length - 1)) * (W - PL - PR);
  const y = (v) => PT + (1 - (v - lo) / (hi - lo || 1)) * (H - PT - PB);

  const line = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area = `${line} L${x(vals.length - 1).toFixed(1)},${H - PB} L${x(0).toFixed(1)},${H - PB} Z`;

  const STROKE = '#2F67BA';
  const ticks = 5;
  const yTicks = Array.from({ length: ticks + 1 }, (_, i) => {
    const v = lo + ((hi - lo) * i) / ticks;
    const dv = state.chartTab === '单位净值' ? v.toFixed(3) : v.toFixed(1);
    return `<line x1="${PL}" y1="${y(v).toFixed(1)}" x2="${W - PR}" y2="${y(v).toFixed(1)}" stroke="#EFEFF6"/>
            <text x="${PL - 5}" y="${(y(v) + 3.2).toFixed(1)}" text-anchor="end" font-size="8.5" fill="#A0A0AE">${dv}</text>`;
  }).join('');

  const step = Math.max(1, Math.round(data.length / 5));
  const xTicks = data.map((d, i) => (i % step === 0 || i === data.length - 1
    ? `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="8.5" fill="#A0A0AE">${String(d.date).slice(5)}</text>`
    : '')).join('');

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:210px;display:block">
    <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${STROKE}" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="${STROKE}" stop-opacity="0"/>
    </linearGradient></defs>
    ${yTicks}
    <path d="${area}" fill="url(#cg)"/>
    <path d="${line}" fill="none" stroke="${STROKE}" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
    ${xTicks}
  </svg>`;
}

  const payload = {
    bank: document.getElementById('fBank').value,
    code: document.getElementById('fCode').value.trim(),
    name: document.getElementById('fName').value.trim(),
    manager: document.getElementById('fManager').value.trim(),
    termType: document.getElementById('fTerm').value,
    riskLevel: document.getElementById('fRisk').value,
    startDate: document.getElementById('fStart').value,
    endDate: document.getElementById('fEnd').value,
    confirmDays: Number(document.getElementById('fConfirm').value),
    quota: document.getElementById('fQuota').value.trim(),
  };
  if (!payload.code) return toast('请填写产品代码');

  try {

    closeModal();
    toast('已保存');
    await loadProducts(true);
    if (payload.bank === '工商银行' && r && r.product) refreshOne(r.product.id, true);
  } catch (e) {
    toast(e.message);

}

  if (!code) return;
  hint.textContent = '查询中…';
  try {
    const r = await api(`/api/lookup?bank=${encodeURIComponent(bank)}&code=${encodeURIComponent(code)}`);
    if (r.found) {
      document.getElementById('fName').value = r.name || '';
      document.getElementById('fManager').value = r.manager || '';
      hint.textContent = '已匹配：' + r.name;
    } else {
      hint.textContent = r.message || '未找到，请手动填写名称';
    }
  } catch (e) {
    hint.textContent = e.message;
  }
}

// ---------------------------------------------------------------- 净值录入

function openNavModal(id) {
  state.navEditId = id;
  const p = state.products.find((x) => x.id === id);
  document.getElementById('navTitle').textContent = '录入净值 · ' + (p ? p.code : '');
  document.getElementById('navTip').textContent =
    p && p.bank !== '工商银行'
      ? `${p.bank}无公开净值接口，请在 App 查看后手动录入（每行：日期,净值）。`
      : '每行一条：日期,净值。留空提交可触发自动抓取。';
  document.getElementById('navText').value = '';
  document.getElementById('navMask').classList.remove('hidden');
}

async function saveNav() {
  const id = state.navEditId;
  const text = document.getElementById('navText').value.trim();
  try {
    if (!text) {
      await refreshOne(id);
    } else {
      const rows = text.split('\n').map((l) => l.trim()).filter(Boolean).map((l) => {
        const [date, nav] = l.split(/[,\t]/).map((s) => s.trim());
        return { date, nav: Number(nav) };
      }).filter((r) => r.date && isFinite(r.nav));
      if (!rows.length) return toast('未解析到有效数据');
      await api(`/api/products/${encodeURIComponent(id)}/nav`, { method: 'POST', body: { rows } });
      toast(`已录入 ${rows.length} 条净值`);
    }
    document.getElementById('navMask').classList.add('hidden');
    await loadProducts(true);
  } catch (e) {
    toast(e.message);
  }
}

// ---------------------------------------------------------------- 刷新

async function refreshOne(id, silent) {
  try {
    const r = await api(`/api/products/${encodeURIComponent(id)}/refresh`, { method: 'POST' });
    if (r.ok) {
      if (!silent) toast(`已更新 ${r.points} 条净值`);
    } else if (r.needManual) {
      if (!silent) { toast(r.message); openNavModal(id); }
    } else if (!silent) {
      toast(r.error || '刷新失败');
    }
    await loadProducts(true);
  } catch (e) {
    if (!silent) toast(e.message);
  }
}

async function refreshAll() {
  toast('正在刷新净值…');
  try {
    const r = await api('/api/refresh', { method: 'POST', body: {} });
    const ok = (r.results || []).filter((x) => x.ok).length;
    const manual = (r.results || []).filter((x) => x.needManual).length;
    let msg = `已更新 ${ok} 个产品`;
    if (manual) msg += `，${manual} 个需手动录入`;
    toast(msg);
    const note = document.getElementById('drawerNote');
    if (note) note.textContent = `最近更新 ${new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`;
    await loadProducts(true);
  } catch (e) {
    toast(e.message);
  }
}

// ---------------------------------------------------------------- 导入导出

async function doExport() {
  try {
    const r = await api('/api/export');
    const blob = new Blob(['\ufeff' + r.csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `理财产品汇总_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    toast('已导出');
  } catch (e) {
    toast(e.message);
  }
}

async function doImport() {
  const text = document.getElementById('importText').value;
  try {
    const r = await api('/api/import', { method: 'POST', body: { text } });
    document.getElementById('importMask').classList.add('hidden');
    toast(`已导入 ${r.added} 个产品`);
    await loadProducts(true);
  } catch (e) {
    toast(e.message);
  }
}

// ---------------------------------------------------------------- 索引

async function buildIndex() {
  try {
    const r = await api('/api/index/build', { method: 'POST', body: {} });
    toast(r.message || '已开始建立索引');
    const timer = setInterval(async () => {
      const s = await api('/api/index/status');
      if (!s.building) {
        clearInterval(timer);
        toast(s.exists ? `索引完成，共 ${s.total} 个产品` : '索引建立失败，请查看服务日志');
      }
    }, 3000);
  } catch (e) {
    toast(e.message);
  }
}

// ---------------------------------------------------------------- 视图切换

function switchView(v) {
  state.view = v;
  document.querySelectorAll('.drawer-item').forEach((t) => t.classList.toggle('active', t.dataset.view === v));
  document.getElementById('view-overview').classList.toggle('hidden', v !== 'overview');
  document.getElementById('view-manage').classList.toggle('hidden', v !== 'manage');
  document.getElementById('view-detail').classList.toggle('hidden', v !== 'detail');

  const bar = document.querySelector('.appbar');
  const right = document.querySelector('.appbar-right');

  if (v === 'detail') {
    bar.classList.add('detail-mode');
    right.className = 'appbar-actions';
    right.innerHTML = `
      <button class="ab-act" id="btnRefreshOne"><span class="x">✕</span> 刷新</button>
      <button class="ab-act" id="btnBackTop"><span class="x">✕</span> 返回</button>
      <button class="ab-act" id="btnPk"><span class="x">✕</span> PK对比</button>`;
    document.getElementById('btnBackTop').onclick = () => switchView('overview');
    document.getElementById('btnRefreshOne').onclick = () => state.detailId && refreshOne(state.detailId);
    document.getElementById('btnPk').onclick = () => toast('PK 对比：在产品管理中勾选两个产品即可对比');
  } else {
    bar.classList.remove('detail-mode');
    right.className = 'appbar-right';
    right.innerHTML = `<button class="avatar" id="btnQuick" aria-label="快捷操作">V</button>`;
    document.getElementById('btnQuick').onclick = openDrawer;
  }

  const title = document.getElementById('appbarTitle');
  title.innerHTML = v === 'manage' ? '产品管理'
    : v === 'detail' ? '产品详情'
    : '<span class="plus">+</span> 理财产品概览';

  if (v === 'manage') renderManage();
}

// ---------------------------------------------------------------- 抽屉

function openDrawer() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerMask').classList.remove('hidden');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerMask').classList.add('hidden');
}

// ---------------------------------------------------------------- 事件绑定

document.getElementById('btnMenu').onclick = openDrawer;
document.getElementById('drawerMask').onclick = closeDrawer;
document.querySelectorAll('.drawer-item').forEach((t) => {
  t.onclick = () => { switchView(t.dataset.view); closeDrawer(); };
});

document.querySelectorAll('#termSeg .seg-item').forEach((b) => {
  b.onclick = () => {
    state.term = b.dataset.term;
    document.querySelectorAll('#termSeg .seg-item').forEach((x) => x.classList.toggle('active', x === b));
    renderOverview();
  };
});

document.getElementById('btnRefresh').onclick = refreshAll;
document.getElementById('btnRefreshAll2').onclick = refreshAll;
const _idxTop = document.getElementById('btnIndexTop');
if (_idxTop) _idxTop.onclick = buildIndex;
document.getElementById('btnIndex2').onclick = buildIndex;
document.getElementById('btnAddTop').onclick = () => openModal(null);
document.getElementById('btnAdd').onclick = () => openModal(null);
document.getElementById('btnExportTop').onclick = doExport;
document.getElementById('btnExport').onclick = doExport;
document.getElementById('btnImport').onclick = () => document.getElementById('importMask').classList.remove('hidden');
document.getElementById('btnQuick').onclick = openDrawer;

document.getElementById('btnSearchToggle').onclick = (e) => {
  const w = document.getElementById('searchWrap');
  w.classList.toggle('hidden');
  e.currentTarget.classList.toggle('on', !w.classList.contains('hidden'));
  if (!w.classList.contains('hidden')) document.getElementById('searchInput').focus();
};
document.getElementById('btnStar').onclick = (e) => {
  state.onlyPositive = !state.onlyPositive;
  e.currentTarget.classList.toggle('on', state.onlyPositive);
  renderOverview();
};
document.getElementById('btnFilterToggle').onclick = () => {
  state.term = state.term === '全部' ? '短期' : '全部';
  document.querySelectorAll('#termSeg .seg-item').forEach((x) => x.classList.toggle('active', x.dataset.term === state.term));
  renderOverview();
};

document.getElementById('searchInput').oninput = (e) => {
  state.keyword = e.target.value;
  renderOverview();
  if (state.view === 'manage') renderManage();
};

document.getElementById('btnSave').onclick = saveProduct;
document.getElementById('btnCancel').onclick = closeModal;
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalMask').onclick = (e) => { if (e.target.id === 'modalMask') closeModal(); };
document.getElementById('btnLookup').onclick = lookupCode;

document.getElementById('navSave').onclick = saveNav;
document.getElementById('navCancel').onclick = () => document.getElementById('navMask').classList.add('hidden');
document.getElementById('navClose').onclick = () => document.getElementById('navMask').classList.add('hidden');

document.getElementById('importCancel').onclick = () => document.getElementById('importMask').classList.add('hidden');
document.getElementById('importClose').onclick = () => document.getElementById('importMask').classList.add('hidden');
document.getElementById('importSave').onclick = doImport;

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  closeModal();
  document.getElementById('navMask').classList.add('hidden');
  document.getElementById('importMask').classList.add('hidden');
  closeDrawer();
});

// ---------------------------------------------------------------- 启动

/** 静态快照模式：隐藏所有写操作入口，只保留浏览 */
function applyOfflineMode() {
  if (!OFFLINE) return;
  document.body.classList.add('offline');
  ['btnRefresh', 'btnRefreshAll2', 'btnAddTop', 'btnAdd', 'btnImport', 'btnIndexTop', 'btnIndex2']
    .forEach((id) => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
  const note = document.getElementById('drawerNote');
  if (note) note.innerHTML = '当前为<b>静态快照</b>，数据截止 ' +
    (window.__DATA__.generatedAt || '').slice(0, 10) + '<br>刷新/编辑请用完整版';
}

applyOfflineMode();
loadProducts();

</script>
</body>
